name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (CPU torch is the default group)
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Fast tests (no model downloads)
        run: uv run --no-sync pytest -m "not slow"

  slow-tests:
    runs-on: ubuntu-latest
    needs: lint-and-fast-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('src/governance_rag/config.py') }}
      - name: Install
        run: uv sync --frozen
      - name: Slow tests (real NLI model)
        run: uv run --no-sync pytest -m slow
